[package]
name = "picsew-desktop"
version = "1.0.0"
description = "SSAI desktop long screenshot utility"
license = "MIT"
authors = ["sansheng"]
edition = "2021"

[lib]
name = "picsew_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[test]]
name = "ocr_backend"
path = "native/ocr_tests.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
xcap = "=0.9.8"
wayscrollshot-band = { path = "vendor/wayscrollshot-band" }

[patch.crates-io]
xcap = { path = "vendor/xcap" }

